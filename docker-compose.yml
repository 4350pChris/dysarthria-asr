services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      # This value is for local development only. Use a random secret before
      # exposing Umami outside this machine.
      APP_SECRET: local-development-only-change-before-production
      DISABLE_TELEMETRY: '1'
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # This value is for local development only. Use a secret before
      # exposing the database outside this machine.
      POSTGRES_PASSWORD: umami
      TZ: UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
