services:
  ollama:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-model:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_HOST: http://ollama:11434
      TEXT_REVIEW_MODEL: ${TEXT_REVIEW_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      TEXT_REVIEW_THREADS: ${TEXT_REVIEW_THREADS:-4}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        ollama pull "$$TEXT_REVIEW_MODEL"
        printf 'FROM %s\nPARAMETER num_thread %s\n' "$$TEXT_REVIEW_MODEL" "$$TEXT_REVIEW_THREADS" > /tmp/Modelfile
        ollama create "$$TEXT_REVIEW_MODEL" -f /tmp/Modelfile
        ollama run "$$TEXT_REVIEW_MODEL" ""
    depends_on:
      ollama:
        condition: service_healthy

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      # This value is for local development only. Use a random secret before
      # exposing Umami outside this machine.
      APP_SECRET: local-development-only-change-before-production
      DISABLE_TELEMETRY: '1'
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # This value is for local development only. Use a secret before
      # exposing the database outside this machine.
      POSTGRES_PASSWORD: umami
      TZ: UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
  umami-db-data:
