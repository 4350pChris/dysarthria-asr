name: CI and Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/4350pchris/dysarthria-asr-frontend
  BACKEND_IMAGE: ghcr.io/4350pchris/dysarthria-asr-backend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/docker-images.yml'
            frontend:
              - 'app/**'
              - '.github/workflows/docker-images.yml'

  backend-checks:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Lint backend
        run: uv run ruff check src tests

      - name: Type-check backend
        run: uv run pyright

      - name: Run backend tests
        run: |
          mkdir -p reports
          uv run pytest --junitxml=reports/backend-pytest.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-report
          path: backend/reports/backend-pytest.xml
          if-no-files-found: error

      - name: Summarize backend tests
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend pytest
          path: backend/reports/backend-pytest.xml
          reporter: java-junit
          fail-on-error: false

  frontend-checks:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm typecheck

  build-and-push-backend:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    needs: [changes, backend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-and-push-frontend:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    needs: [changes, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
